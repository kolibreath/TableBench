<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>项目管理工具箱</title>
  <link rel="stylesheet" href="vendor/icons.css">
  <style>
    /* ═══ 设计令牌：与功能点估算工具（frontend/）同源 ═══ */
    :root {
      --green-deep: #1b5e20;
      --green: #2e7d32;
      --green-bright: #43a047;
      --green-soft: #a5d6a7;
      --bg: #e8f5e9;
      --panel: #f1f8f4;
      --text: #1b2e1f;
      --muted: #5a6b5c;
      --border: rgba(0, 0, 0, 0.08);
      --warn: #f9a825;
      --danger: #c62828;
      --radius: 14px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 340px;
      font-family: system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    /* ── 顶栏：深林绿渐变，工具名 + 版本 ── */
    .hd {
      position: relative;
      display: flex; align-items: center; gap: 11px;
      padding: 16px 18px 14px;
      background: linear-gradient(135deg, var(--green-deep), var(--green));
      color: #fff;
      overflow: hidden;
    }
    .hd::after {                       /* 签名纹理：右上一道浅绿斜切光带 */
      content: "";
      position: absolute; right: -34px; top: -42px;
      width: 130px; height: 130px;
      background: rgba(255, 255, 255, 0.07);
      transform: rotate(28deg);
      border-radius: 26px;
      pointer-events: none;
    }
    .hd .mark {
      width: 38px; height: 38px; border-radius: 11px;
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.28);
      display: flex; align-items: center; justify-content: center;
      font-size: 17px; font-weight: 700;
    }
    .hd .name { font-size: 16px; font-weight: 700; letter-spacing: 0.02em; }
    .hd .ver {
      font-family: var(--mono);
      font-size: 10.5px; opacity: 0.85; margin-top: 2px; letter-spacing: 0.04em;
    }

    /* ── 台账清单：编号 + 账脊 + 工具卡 ── */
    .list { padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .tool {
      position: relative;
      display: flex; align-items: center; gap: 12px;
      padding: 12px 12px 12px 16px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
    }
    .tool::before {                    /* 签名：账脊（生命周期序号的纵轴） */
      content: "";
      position: absolute; left: 0; top: 12px; bottom: 12px;
      width: 3px; border-radius: 0 3px 3px 0;
      background: linear-gradient(180deg, var(--green), var(--green-bright));
      opacity: .85;
    }
    .tool:hover {
      transform: translateY(-1px);
      border-color: var(--green-soft);
      box-shadow: 0 4px 14px rgba(46, 125, 50, 0.16);
    }
    .tool:active { transform: translateY(0); }
    .tool:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
    .tool .idx {
      font-family: var(--mono);
      font-size: 11px; font-weight: 600; color: var(--green);
      width: 20px; flex-shrink: 0; letter-spacing: 0.05em;
    }
    .tool .icon {
      width: 38px; height: 38px; border-radius: 10px;
      background: var(--bg);
      border: 1px solid var(--green-soft);
      color: var(--green);
      display: flex; align-items: center; justify-content: center;
      font-size: 17px; flex-shrink: 0;
      transition: background .16s ease, color .16s ease;
    }
    .tool:hover .icon { background: var(--green); border-color: var(--green); color: #fff; }
    .tool .info { flex: 1; min-width: 0; }
    .tool .info .name {
      font-size: 14px; font-weight: 600; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .tool .info .desc {
      font-size: 12px; color: var(--muted); margin-top: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .tool .arrow { color: var(--green-soft); font-size: 15px; flex-shrink: 0; transition: color .16s, transform .16s; }
    .tool:hover .arrow { color: var(--green); transform: translateX(2px); }

    /* ── 底栏：服务状态 + 数据收集开关（mono，审计气质） ── */
    .ft {
      display: flex; align-items: center; justify-content: space-between;
      padding: 9px 16px 12px;
      border-top: 1px dashed rgba(46, 125, 50, 0.28);
      margin: 2px 6px 0;
      font-family: var(--mono);
      font-size: 10.5px; color: var(--muted);
    }
    .ft .svc { display: flex; align-items: center; gap: 5px; }
    .ft .dot { width: 7px; height: 7px; border-radius: 50%; background: #c8d6c9; }
    .ft .dot.online { background: var(--green-bright); box-shadow: 0 0 0 3px rgba(67, 160, 71, 0.18); }
    .ft .dot.offline { background: var(--danger); }
    .ft .switch { cursor: pointer; user-select: none; }
    .ft .switch:hover { color: var(--green); }
    /* ── 悬浮球测试入口 + 形态提示 ── */
    .hint {
      margin: 0 14px 8px;
      font-size: 11px; color: var(--muted);
      text-align: center; line-height: 1.5;
      text-wrap: balance;
    }
    .test-btn {
      display: block;
      margin: 0 14px 10px;
      padding: 8px 0;
      width: calc(100% - 28px);
      background: #fff; color: var(--green);
      border: 1px dashed var(--green-soft); border-radius: 9px;
      cursor: pointer; font-size: 12.5px; font-family: inherit;
      transition: background .15s ease, border-color .15s ease;
    }
    .test-btn:hover { background: var(--panel); border-color: var(--green); }
    .test-btn:disabled { opacity: .6; cursor: wait; }
    @media (prefers-reduced-motion: reduce) {
      .tool, .tool .icon, .tool .arrow { transition: none; }
      .tool:hover { transform: none; }
    }
  </style>
</head>
<body>
  <div class="hd">
    <span class="mark">项</span>
    <div>
      <div class="name">项目管理工具箱</div>
      <div class="ver" id="ver">v3.0.0</div>
    </div>
  </div>

  <div class="list" id="toolList"></div>

  <div class="hint">项目查询、项目工作台、工时填报需在 <b>ITA 页面</b>内通过悬浮球使用</div>
  <button class="test-btn" id="testBallBtn" title="把悬浮球注入当前页面（任意本地页面即可预览 UI 形态）">🧪 在当前页测试悬浮球</button>

  <div class="ft">
    <span class="svc"><span class="dot" id="svcDot"></span><span id="svcText">本地服务：检测中…</span></span>
    <span class="switch" id="collectNote" title="检查数据仅用于本地留痕与质量分析">数据收集：开</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
